name: Public docsite lint regression
on:
  pull_request:
    paths:
      - apps/public-docsite/**
      - packages/eslint-plugin/**
      - packages/react-components/eslint-plugin-react-components/**
      - scripts/tasks/**
      - nx.json
      - eslint.config.js
      - package.json
      - yarn.lock
      - .github/workflows/public-docsite-lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: ubuntu-latest
    env:
      NX_PREFER_TS_NODE: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: yarn
          node-version: '22'
      - run: yarn install --immutable
      - name: Build workspace dependencies and docsite
        run: yarn nx run public-docsite:prebundle --skipNxCache
      - name: Check lint without generated docsite output
        run: |
          yarn workspace @fluentui/public-docsite clean
          yarn nx run public-docsite:test:lint --skipNxCache
          yarn workspace @fluentui/public-docsite lint
      - name: Check lint after prebundle
        run: |
          yarn workspace @fluentui/public-docsite prebundle
          yarn workspace @fluentui/public-docsite lint
          yarn nx run public-docsite:test:lint --skipNxCache
