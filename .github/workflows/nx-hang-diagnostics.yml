#
# TEMPORARY diagnostic workflow — remove once the Nx 22 upgrade (see #36435) lands.
#
# The published de-indent Wasm plugin hangs in SWC even without Nx. The native/legacy
# runner comparison stalled in both arms, and theme/shared-contexts-only builds did
# not exercise that plugin. Evaluate the independent tooling fixes separately from
# the still-blocked plugin-bearing build, with streamed output and bounded jobs.
#
name: Nx Hang Diagnostics (temporary)

on:
  push:
    branches:
      - chore/nx-22-upgrade
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: 'false'
  NX_CACHE_PROJECT_GRAPH: 'false'
  NX_PREFER_TS_NODE: true
  NX_VERBOSE_LOGGING: true
  BROWSERSLIST_IGNORE_OLD_DATA: true

jobs:
  diag:
    if: ${{ github.repository_owner == 'PaulGMardling' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tooling-regressions-linux
            os: ubuntu-latest
            timeout: 20
            isolate_plugins: 'true'
            cmd: >-
              yarn nx run workspace-plugin:test --skipNxCache --outputStyle=stream
              --args="--runInBand --runTestsByPath src/executors/build/executor.spec.ts src/plugins/workspace-plugin.spec.ts"
          - name: tooling-regressions-windows
            os: windows-latest
            timeout: 20
            isolate_plugins: 'true'
            cmd: >-
              yarn nx run workspace-plugin:test --skipNxCache --outputStyle=stream
              --args="--runInBand --runTestsByPath src/executors/build/executor.spec.ts src/plugins/workspace-plugin.spec.ts"
          - name: nested-cwd-graph
            os: ubuntu-latest
            timeout: 15
            isolate_plugins: 'false'
            cmd: yarn nx run workspace-plugin:check-graph --skipNxCache --outputStyle=stream
          - name: plugin-bearing-build
            os: ubuntu-latest
            timeout: 15
            isolate_plugins: 'true'
            cmd: yarn nx run react-jsx-runtime:build --skipNxCache --outputStyle=stream --nxBail
    name: diag / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      NX_ISOLATE_PLUGINS: ${{ matrix.isolate_plugins }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: 'yarn'
          node-version: '22'

      - name: Run yarn install --immutable
        run: yarn install --immutable

      - name: Run diagnostic command
        run: ${{ matrix.cmd }}
