pr: none
trigger: none

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: true

# Customize build number to include package prefix
# Example: headless_experimental_20201022.1
name: "headless_experimental_${{ iif(parameters.dryRun, 'dryrun_', '') }}$(Date:yyyyMMdd)$(Rev:.r)"

variables:
  - template: /.devops/templates/variables/variables.yml@self
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: /.devops/templates/release.yml@self
  parameters:
    releaseType: experimental
    label: headless experimental
    beachballConfig: scripts/beachball/src/release-headless.config.js
    nxScope: -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**'
    # Bumps headless packages to a x.x.x-experimental.<feature>.<date>-<hash> version.
    # x.x.x is derived from @fluentui/react-headless-components-preview so it stays on its own 0.x line.
    bumpUnofficialVersionsScript: |
      DATE=$(date +"%Y%m%d")
      HASH=$(git rev-parse --short HEAD)
      BASE_VERSION=$(node -p "require('./packages/react-components/react-headless-components-preview/library/package.json').version")
      NEW_VERSION="${BASE_VERSION}-experimental.$(experimentalFeatureName).${DATE}-${HASH}"

      echo "Target version: ${NEW_VERSION}"

      yarn nx g @fluentui/workspace-plugin:version-bump --name react-headless-components-preview --explicitVersion "${NEW_VERSION}"
    dryRun: ${{ parameters.dryRun }}
