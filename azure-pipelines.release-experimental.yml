pr: none
trigger: none

# Example: v9_experimental_20201022.1
name: "${{ parameters.releaseGroup }}_experimental_${{ iif(parameters.dryRun, 'dryrun_', '') }}$(Date:yyyyMMdd)$(Rev:.r)"

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: true
  - name: releaseGroup
    displayName: Release Group
    type: string
    values: ['v9', 'headless', 'tools']
    default: 'v9'

variables:
  - template: /.devops/templates/variables/variables.yml@self

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: /.devops/templates/release.yml@self
  parameters:
    releaseType: experimental
    label: ${{ parameters.releaseGroup }} experimental
    dryRun: ${{ parameters.dryRun }}

    ${{ if eq(parameters.releaseGroup, 'v9') }}:
      beachballConfig: scripts/beachball/src/release-vNext.config.js
      nxScope: -p 'tag:vNext' --exclude 'tag:npm:private,tag:tools,tag:charting,tag:react-headless'
      # Bumps all v9 packages to a x.x.x-experimental.<feature>.<date>-<hash> version.
      # x.x.x is derived from the current version @fluentui/react-components package.json.
      bumpUnofficialVersionsScript: |
        BASE_VERSION=$(node -p "require('./packages/react-components/react-components/package.json').version")
        DATE=$(date +"%Y%m%d")
        HASH=$(git rev-parse --short HEAD)
        NEW_VERSION="${BASE_VERSION}-experimental.${EXPERIMENTAL_FEATURE_NAME}.${DATE}-${HASH}"

        echo "Target version: ${NEW_VERSION}"

        yarn nx g @fluentui/workspace-plugin:version-bump --all --explicitVersion "${NEW_VERSION}"

    ${{ if eq(parameters.releaseGroup, 'headless') }}:
      beachballConfig: scripts/beachball/src/release-headless.config.js
      nxScope: -p 'tag:react-headless,!tag:npm:private,!tag:type:stories' --exclude 'apps/**'
      # Bumps headless packages to a x.x.x-experimental.<feature>.<date>-<hash> version.
      # x.x.x is derived from @fluentui/react-headless-components-preview so it stays on its own 0.x line.
      bumpUnofficialVersionsScript: |
        DATE=$(date +"%Y%m%d")
        HASH=$(git rev-parse --short HEAD)
        BASE_VERSION=$(node -p "require('./packages/react-components/react-headless-components-preview/library/package.json').version")
        NEW_VERSION="${BASE_VERSION}-experimental.${EXPERIMENTAL_FEATURE_NAME}.${DATE}-${HASH}"

        echo "Target version: ${NEW_VERSION}"

        yarn nx g @fluentui/workspace-plugin:version-bump --name react-headless-components-preview --explicitVersion "${NEW_VERSION}"

    ${{ if eq(parameters.releaseGroup, 'tools') }}:
      beachballConfig: scripts/beachball/src/release-tools.config.js
      nxScope: -p 'tag:tools,!tag:npm:private,!tag:v8' --exclude 'apps/**'
      # Bumps all tools packages to x.x.x-experimental.<feature>.<date>-<hash> version.
      # x.x.x is each package's own current version.
      bumpUnofficialVersionsScript: |
        DATE=$(date +"%Y%m%d")
        HASH=$(git rev-parse --short HEAD)
        VERSION_SUFFIX="experimental.${EXPERIMENTAL_FEATURE_NAME}.${DATE}-${HASH}"

        echo "Version suffix: ${VERSION_SUFFIX}"

        yarn nx g @fluentui/workspace-plugin:version-bump --all --scope tools --versionSuffix "${VERSION_SUFFIX}"
