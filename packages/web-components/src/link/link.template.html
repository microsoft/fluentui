<f-template name="fluent-link" shadowrootmode="open" shadowrootdelegatesfocus>
  <template @focusin="{focusHandler($e)}" @focusout="{focusHandler($e)}" @pointerdown="{focusHandler($e)}"
    >{{styles}}<a
      download="{{download}}"
      href="{{href}}"
      hreflang="{{hreflang}}"
      part="control"
      ping="{{ping}}"
      referrerpolicy="{{referrerpolicy}}"
      rel="{{rel}}"
      tabindex="0"
      target="{{target}}"
      type="{{type}}"
      f-ref="{control}"
      ><slot></slot></a
  ></template>
</f-template>
