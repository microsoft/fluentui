# This is the main release pipeline template.
# It follows the pattern described here (plus some Fluent-specific steps):
# https://github.com/microsoft/beachball/blob/main/packages/esrp-npm-release/README.md

parameters:
  # Release type
  - name: releaseType
    type: string
    values: ['official', 'experimental', 'nightly']

  # Beachball configuration file
  - name: beachballConfig
    type: string

  # Release label for change files and commit messages
  - name: label
    type: string

  # Nx project selection arguments to build/test/lint/bundle
  - name: nxScope
    type: string

  # npm distribution tag override.
  # Defaults to 'latest' for official releases and ${{ parameters.releaseType }} otherwise.
  - name: npmTag
    type: string
    default: ''

  # Required for experimental/nightly: this script should invoke @fluentui/workspace-plugin:version-bump
  # with arguments to bump the appropriate packages to the desired version.
  # For releaseType: 'experimental', the environment variable `EXPERIMENTAL_FEATURE_NAME` will be available.
  - name: bumpUnofficialVersionsScript
    type: string
    # This is not run for official releases, and is required for experimental/nightly.
    default: 'echo "##vso[task.logissue type=error]bumpUnofficialVersionsScript must be specified for unofficial releases" && exit 1'

  # Extra output artifacts for the build job.
  # The directories must be under outputParentDirectory (see below) for compliance scanning.
  - name: extraOutputs
    type: object
    default: []

  # Extra steps to run in the build job before packages are actually built.
  - name: preBuildSteps
    type: stepList
    default: []

  # Extra steps to run in the build job after packages are packed.
  - name: postPackSteps
    type: stepList
    default: []

  # Extra steps to run in the push job after pushing package updates.
  # The github token is available as $(createToken.GITHUB_APP_TOKEN).
  # It's up to the caller to skip in dry run mode if needed.
  - name: postPushSteps
    type: stepList
    default: []

  # Dry run mode (set in the UI)
  - name: dryRun
    type: boolean

  # Not intended to be overridden - this just ensures they're available when expanding templates
  - name: packagesArtifactName
    type: string
    default: packed-packages
  - name: releaseToolArtifactName
    type: string
    default: release-api-tool

# NOTE: In this template which extends another template, variables may NOT be declared at top level,
# only per-job. (Declaring at top level causes a misleading error "Unexpected value 'extends'"
# when actually the issue is that a template can have `extends` or `variables` but not both.)

extends:
  template: v1/Office.Official.PipelineTemplate.yml@OfficePipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need Windows because compliance tasks only run on Windows.
    settings:
      # If any job has `type: releaseJob`, it applies strict network isolation to the whole pipeline.
      # Re-enable the access needed. (For some reason DefaultDeny actually enables contacting ADO...)
      networkIsolationPolicy: DefaultDeny,AzureActiveDirectory,AzureKeyVault,AzureStorage,GitHub

    stages:
      # Build and test, then generate packed packages and other artifacts to release.
      - stage: build
        jobs:
          - job: build_pack
            displayName: Build and pack
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            timeoutInMinutes: 90
            workspace:
              clean: all
            variables:
              - template: /.devops/templates/variables/variables.yml@self
              - template: /.devops/templates/variables/readonly-variables.yml@self
                parameters:
                  variables:
                    PACKAGES_ARTIFACT_PATH: $(BUILD_OUTPUT_PARENT_DIR)/${{ parameters.packagesArtifactName }}
                    RELEASE_TOOL_ARTIFACT_PATH: $(BUILD_OUTPUT_PARENT_DIR)/${{ parameters.releaseToolArtifactName }}
            templateContext:
              # Setting this ensures that compliance scans are only run once per pipeline, not per artifact.
              outputParentDirectory: $(BUILD_OUTPUT_PARENT_DIR)
              outputs:
                - output: pipelineArtifact
                  artifactName: ${{ parameters.packagesArtifactName }}
                  path: $(PACKAGES_ARTIFACT_PATH)
                - output: pipelineArtifact
                  artifactName: ${{ parameters.releaseToolArtifactName }}
                  path: $(RELEASE_TOOL_ARTIFACT_PATH)
                - ${{ each output in parameters.extraOutputs }}:
                    - ${{ output }}
            steps:
              # Install tools, authenticate with npm, and install dependencies.
              - template: /.devops/templates/steps/setup.yml@self
                parameters:
                  releaseType: ${{ parameters.releaseType }}

              # Update versions and change files for an experimental or nightly release.
              - ${{ if ne(parameters.releaseType, 'official') }}:
                  # Deletes all existing change files so that only bump that happens is for experimental/nightly.
                  - script: |
                      rm -f change/*
                    displayName: Delete existing change files

                  # EXPERIMENTAL_FEATURE_NAME is set in variables.yml and validated in setup.yml.
                  - script: ${{ parameters.bumpUnofficialVersionsScript }}
                    displayName: Bump ${{ parameters.releaseType }} versions

                  # Create temporary change files and make a temporary commit.
                  # The messages aren't very important since the changelog and commit won't be pushed.
                  - script: |
                      git add .
                      yarn change \
                        --config "$BEACHBALL_CONFIG" \
                        --type prerelease \
                        --message "Release $RELEASE_LABEL" \
                        --dependent-change-type prerelease

                      git commit -m "bump $RELEASE_LABEL versions"
                    displayName: Create and commit prerelease change files
                    env:
                      BEACHBALL_CONFIG: ${{ parameters.beachballConfig }}
                      RELEASE_LABEL: ${{ parameters.label }}

              - script: |
                  echo "Packages in the release scope:"
                  yarn nx show projects ${{ parameters.nxScope }}
                displayName: Show packages

              - ${{ each step in parameters.preBuildSteps }}:
                  - ${{ step }}

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t build ${{ parameters.nxScope }} --nxBail
                displayName: build

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t test ${{ parameters.nxScope }} --nxBail
                displayName: test

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t lint ${{ parameters.nxScope }} --nxBail
                displayName: lint

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t bundle ${{ parameters.nxScope }} --nxBail
                displayName: bundle

              - script: |
                  FLUENT_PROD_BUILD=true yarn nx run-many -t verify-packaging ${{ parameters.nxScope }} --nxBail
                displayName: verify packaged assets

              # Create PACKAGES_ARTIFACT_PATH so it exists for the output even if nothing was packed.
              # Also copy the release API tool for use in the publish job (which can't download sources).
              - script: |
                  mkdir -p "$PACKAGES_ARTIFACT_PATH"
                  mkdir -p "$RELEASE_TOOL_ARTIFACT_PATH"
                  cp node_modules/@microsoft/esrp-npm-release/dist/index.mjs "$RELEASE_TOOL_ARTIFACT_PATH"
                displayName: Prepare artifact paths

              # Pack packages only (don't push changes to GitHub or publish to npm).
              # The release configs set `fetch: false` to ensure that all beachball operations in
              # the multi-stage pipeline use the original Build.SourceVersion.
              - script: |
                  yarn beachball publish \
                    --no-push \
                    --pack-to-path "$PACKAGES_ARTIFACT_PATH" \
                    --config "$BEACHBALL_CONFIG" \
                    -b "origin/$BRANCH_PATH"
                displayName: Pack packages
                condition: and(succeeded(), not(${{ parameters.dryRun }}))
                env:
                  BEACHBALL_CONFIG: ${{ parameters.beachballConfig }}

              # TODO verify this leaves the branch in the expected state
              - script: |
                  set -x
                  git status
                  git diff
                  git diff --cached
                displayName: Show git status and diff

              - ${{ each step in parameters.postPackSteps }}:
                  - ${{ step }}

      # Publish the packed packages to npm using the ESRP Release API.
      - stage: publish
        displayName: Publish
        dependsOn: build
        jobs:
          - job: npm_publish
            displayName: Publish npm packages
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            variables:
              - template: /.devops/templates/variables/variables.yml@self
              - template: /.devops/templates/variables/readonly-variables.yml@self
                parameters:
                  variables:
                    PACKAGES_ARTIFACT_PATH: $(Agent.BuildDirectory)/${{ parameters.packagesArtifactName }}
                    RELEASE_TOOL_ARTIFACT_PATH: $(Agent.BuildDirectory)/${{ parameters.releaseToolArtifactName }}
                    RELEASE_TOOL_ARTIFACT_BIN: $(RELEASE_TOOL_ARTIFACT_PATH)/index.mjs
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: ${{ parameters.packagesArtifactName }}
                  targetPath: $(PACKAGES_ARTIFACT_PATH)
                - input: pipelineArtifact
                  artifactName: ${{ parameters.releaseToolArtifactName }}
                  targetPath: $(RELEASE_TOOL_ARTIFACT_PATH)

            steps:
              # This step can't run yarn install, but node is needed to run the release API helper
              - template: /.devops/templates/steps/setup.yml@self
                parameters:
                  releaseType: ${{ parameters.releaseType }}
                  skipYarnInstall: true

              - script: |
                  ls -R "$PACKAGES_ARTIFACT_PATH"
                  ls -R "$RELEASE_TOOL_ARTIFACT_PATH"
                displayName: Show artifact contents

              - task: AzureCLI@2
                displayName: Get credentials for staging blob storage
                inputs:
                  azureSubscription: ogx-esrp-infra-bot
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  inlineScript: |
                    echo "##vso[task.setvariable variable=STAGING_TENANT_ID]$tenantId"
                    echo "##vso[task.setvariable variable=STAGING_CLIENT_ID]$servicePrincipalId"
                    echo "##vso[task.setvariable variable=STAGING_ID_TOKEN;issecret=true]$idToken"

              - task: AzureKeyVault@2
                displayName: Get ESRP certificates from Key Vault
                inputs:
                  # Service connection to the OGX subscription in the Torus tenant
                  azureSubscription: ESRP-JSHost3
                  KeyVaultName: OGX-JSHost-KV
                  SecretsFilter: OGX-JSHost-Auth4,OGX-JSHost-Sign3

              # Release packages using the ESRP API. If this stage fails or times out, it's safe to
              # manually re-run the stage unless the result in the logs is failDoNotRetry.
              # https://github.com/microsoft/beachball/blob/main/packages/esrp-npm-release/README.md
              - script: node "$RELEASE_TOOL_ARTIFACT_BIN"
                displayName: Publish npm packages using ESRP Release API
                # For a dry run, skip only the publish step (still verify that getting creds worked).
                condition: and(succeeded(), not(${{ parameters.dryRun }}))
                env:
                  PACKED_PACKAGES_PATH: $(PACKAGES_ARTIFACT_PATH)
                  ESRP_PRODUCT_NAME: fluentui - ${{ parameters.label }}
                  ${{ if ne(parameters.npmTag, '') }}:
                    ESRP_NPM_TAG: ${{ parameters.npmTag }}
                  ${{ elseif eq(parameters.releaseType, 'official') }}:
                    ESRP_NPM_TAG: latest
                  ${{ else }}:
                    ESRP_NPM_TAG: ${{ parameters.releaseType }}
                  # The release is auto-approved (this only controls owners in the ESRP release UI).
                  # TODO figure out who should be listed as owners/approvers (it's not very important since it's auto-approved)
                  ESRP_USER: TODO_EMAIL_HERE@microsoft.com
                  ESRP_APPROVERS: TODO_EMAIL_HERE@microsoft.com
                  # Standard Fluent/OGX team ESRP setup:
                  # "OGX JSHost" ESRP client ID
                  ESRP_CLIENT_ID: 0a35e01f-eadf-420a-a2bf-def002ba898d
                  # Torus tenant ID
                  ESRP_TENANT_ID: cdc5aeea-15c5-4db6-b079-fcadd2505dc2
                  ESRP_AUTH_CERT: $(OGX-JSHost-Auth4)
                  ESRP_REQUEST_SIGNING_CERT: $(OGX-JSHost-Sign3)
                  STAGING_STORAGE_ACCOUNT_NAME: ogxesrptempstorage
                  STAGING_CLIENT_ID: $(STAGING_CLIENT_ID)
                  STAGING_TENANT_ID: $(STAGING_TENANT_ID)
                  STAGING_ID_TOKEN: $(STAGING_ID_TOKEN)

      # Only for official releases: push package updates back to GitHub after publishing to npm.
      - ${{ if eq(parameters.releaseType, 'official') }}:
          - stage: push
            displayName: Push to git
            dependsOn: publish
            jobs:
              - job: push
                variables:
                  - template: /.devops/templates/variables/variables.yml@self
                pool:
                  name: Azure-Pipelines-1ESPT-ExDShared
                  image: ubuntu-latest
                  os: linux
                steps:
                  - template: /.devops/templates/steps/setup.yml@self
                    parameters:
                      releaseType: ${{ parameters.releaseType }}

                  - script: |
                      FLUENT_PROD_BUILD=true yarn nx run-many -t build ${{ parameters.nxScope }} --nxBail
                    displayName: Build

                  - task: AzureCLI@2
                    name: createToken
                    displayName: Create GitHub App token
                    inputs:
                      azureSubscription: ogx-oss-release-bot
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: yarn beachball-auth-helper create-github-app-token
                    env:
                      APP_CLIENT_ID: Iv23ligBoU5jc9SIFnGR
                      KEY_ID: https://ogx-oss-release-keyvault.vault.azure.net/keys/office-ogx-auth-helper-key
                      REPOSITORY: $(Build.Repository.Name)
                      PERMISSIONS: contents:write
                      CI_OUTPUT_NAME: GITHUB_APP_TOKEN

                  # Bump again and push the version updates, changelogs, change file deletions, and tags.
                  # The release configs set `fetch: false` to ensure that all beachball operations in
                  # the multi-stage pipeline use the original Build.SourceVersion.
                  - script: |
                      yarn beachball publish \
                        --no-publish \
                        --config "$BEACHBALL_CONFIG" \
                        --message "release: applying package updates - $RELEASE_LABEL"
                    displayName: Push package updates
                    condition: and(succeeded(), not(${{ parameters.dryRun }}))
                    env:
                      BEACHBALL_GIT_TOKEN: $(createToken.GITHUB_APP_TOKEN)
                      BEACHBALL_CONFIG: ${{ parameters.beachballConfig }}
                      RELEASE_LABEL: ${{ parameters.label }}

                  # These steps should be able to use the token.
                  - ${{ each step in parameters.postPushSteps }}:
                      - ${{ step }}

                  - script: yarn beachball-auth-helper revoke-github-app-token
                    displayName: Revoke GitHub App token
                    condition: and(always(), ne(variables['createToken.GITHUB_APP_TOKEN'], ''))
                    env:
                      TOKEN: $(createToken.GITHUB_APP_TOKEN)
