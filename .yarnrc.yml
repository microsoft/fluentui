# Yarn will delete the comments on automatic file updates.
# Please bring them back!

nodeLinker: node-modules

# Only install packages >= 7 days old to match internal quarantine policy.
npmMinimalAgeGate: 7d

# Packages listed here must:
# 1. Be on the quarantine-exempt list for the internal feed
# 2. Only depend on < 7d old versions of other quarantine-exempt packages
npmPreapprovedPackages:
  - '@microsoft/esrp-npm-release'
  - beachball
  - p-graph

# Only used by releases (must be enabled with npmrcAuthEnabled or YARN_NPMRC_AUTH_ENABLED)
plugins:
  - checksum: 5ea21341a477907c298afb531f4a0b30f4347e893a3dc9b72c74645a38bb99e760ba8eca5bf1f13cc36d0cdf4ee208df7d96229e54bf604222b3151e5b2b0565
    path: .yarn/plugins/@yarnpkg/plugin-npmrc.cjs
    spec: 'https://raw.githubusercontent.com/microsoft/beachball/yarn-plugin-npmrc_v0.5.1/yarn-plugins/npmrc/dist/plugin.js'

yarnPath: .yarn/releases/yarn-4.12.0.cjs
