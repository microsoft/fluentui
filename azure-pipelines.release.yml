pr: none
trigger: none

# Customize build number to include major version
# Example: v8_20201022.1
name: "v8_${{ iif(parameters.dryRun, 'dryrun_', '') }}$(Date:yyyyMMdd)$(Rev:.r)"

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

variables:
  - template: /.devops/templates/variables/variables.yml@self

resources:
  repositories:
    - repository: OfficePipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release

extends:
  template: /.devops/templates/release.yml@self
  parameters:
    dryRun: ${{ parameters.dryRun }}
    releaseType: official
    beachballConfig: scripts/beachball/src/release-v8.config.js
    label: react v8
    nxScope: -p tag:v8 --exclude tag:vNext,tag:tools,ssr-tests,vr-tests,perf-test
    extraOutputs:
      - output: pipelineArtifact
        path: $(BUILD_OUTPUT_PARENT_DIR)/homepage
        artifactName: homepage.htm
      - output: pipelineArtifact
        path: $(BUILD_OUTPUT_PARENT_DIR)/site-manifests
        artifactName: site-manifests
      - output: pipelineArtifact
        path: $(BUILD_OUTPUT_PARENT_DIR)/fabric-website
        artifactName: fabric-website

    preBuildSteps:
      - script: |
          yarn generate-version-files
        displayName: Generate version files

    # TODO verify repo state and whether this is using the post-bump version
    postPackSteps:
      # create-site-manifests is a script defined in @fluentui/public-docsite-setup.
      # It generates manifest files used to load the current version on developer.microsoft.com/fluentui.
      - script: |
          yarn create-site-manifests ./packages/react
        displayName: 'Generate website manifests'

      # Generate the homepage.htm file used to load developer.microsoft.com/fluentui. Note that the
      # generated file must be manually checked in to an internal repo, it's just generated as a build
      # artifact for convenience and tracking.
      - script: |
          node ./packages/public-docsite-setup/scripts/generateHomepage "$BUILD_OUTPUT_PARENT_DIR/homepage"
        displayName: 'Generate homepage.htm'

      - script: |
          cp -R ./apps/public-docsite/dist "$BUILD_OUTPUT_PARENT_DIR/fabric-website"
          cp -R ./site-manifests "$BUILD_OUTPUT_PARENT_DIR/site-manifests"
        displayName: Copy website artifacts to staging directory

    # Since v8 updates should be very rare, it's probably not necessary to update the website.
    # If an update is needed, the Azure service connection will need to be re-created, and the following
    # parameters would be added to the publish stage template:
    # postPublishSteps:
    #   - ${{ if eq(parameters.dryRun, false) }}:
    #       - template: /.devops/templates/steps/publish-website.yml@self
    # extraPublishInputs:
    #   - artifactName: fabric-website
    #     targetPath: $(Agent.BuildDirectory)/fabric-website
    #   - artifactName: site-manifests
    #     targetPath: $(Agent.BuildDirectory)/site-manifests

    postPushSteps:
      - script: |
          node -r ./scripts/ts-node/src/register ./scripts/update-release-notes/src/index.ts --apply --debug
        condition: not(${{ parameters.dryRun }})
        displayName: 'Update github release notes'
        env:
          TOKEN: $(createToken.GITHUB_APP_TOKEN)
