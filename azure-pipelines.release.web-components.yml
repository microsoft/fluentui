pr: none
trigger: none

# Customize build number to include major version
# Example: web-components_20201022.1
name: 'web-components_$(Date:yyyyMMdd)$(Rev:.r)'

parameters:
  - name: dryRun
    displayName: Dry Run Mode
    type: boolean
    default: false

  # Escape hatch for when the GitHub PAT is broken and a release cannot wait for it to be rotated.
  # Publishes to npm but skips the git push. The run finishes as partiallySucceeded, and the repo is
  # resynced afterwards by running the "release-recovery" skill against the run.
  - name: forceReleaseWithoutGitPush
    displayName: 'Force release even if git PAT is invalid (npm only, manual repo update required)'
    type: boolean
    default: false

variables:
  - group: 'Github and NPM secrets'
  - template: .devops/templates/variables.yml
    parameters:
      skipComponentGovernanceDetection: false
  - name: release.web_components # Used to scope beachball to release only vnext packages
    value: true
  - name: tags
    value: production,externalfacing

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

schedules:
  # Triggers the nightly release
  # minute 0, hour 4 in UTC (5am in UTC+1), any day of month, any month, days 1-5 of week (M-F)
  # https://docs.microsoft.com/en-us/azure/devops/pipelines/build/triggers?tabs=yaml&view=azure-devops#supported-cron-syntax
  - cron: '0 4 * * 1-5'
    displayName: 'Daily release (M-F at 5am UTC+1)'
    branches:
      include:
        - master

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows # We need windows because compliance task only run on windows.
    stages:
      - stage: main
        jobs:
          - job: Release
            pool:
              name: '1ES-Host-Ubuntu'
              image: '1ES-PT-Ubuntu-20.04'
              os: linux
            workspace:
              clean: all
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(System.DefaultWorkingDirectory)
                  artifactName: output
            steps:
              - template: .devops/templates/tools.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - script: |
                  git config user.name "Fluent UI Build"
                  git config user.email "fluentui-internal@service.microsoft.com"
                  git remote set-url origin https://$(githubUser):$(githubPAT)@github.com/microsoft/fluentui.git
                displayName: Authenticate git for pushes

              - task: Bash@3
                inputs:
                  filePath: yarn-ci.sh
                displayName: yarn

              # Fail fast: catch a broken GitHub PAT now rather than after a long build/test cycle.
              # This is purely an optimization - the authoritative check runs again immediately
              # before publish, so a token that expires mid-build is still caught.
              - script: |
                  set -euo pipefail

                  force=$(echo "$FORCE_RELEASE_WITHOUT_GIT_PUSH" | tr '[:upper:]' '[:lower:]')

                  allowFailure=""
                  if [ "$force" = "true" ]; then
                    allowFailure="--allow-failure"
                  fi

                  node -r ./scripts/ts-node/src/register ./scripts/executors/src/check-git-push-access.ts \
                    --remote origin --branch master $allowFailure
                condition: and(succeeded(), not(${{ parameters.dryRun }}))
                env:
                  GITHUB_PAT: $(githubPAT)
                  FORCE_RELEASE_WITHOUT_GIT_PUSH: ${{ parameters.forceReleaseWithoutGitPush }}
                displayName: 'Preflight (early): verify git push access'

              - script: |
                  yarn nx run-many -t format:check lint test build -p tag:web-components --exclude vr-tests-web-components --nxBail
                displayName: Build, Test, Lint

              - template: .devops/templates/release-git-preflight.yml@self
                parameters:
                  branch: master
                  dryRun: ${{ parameters.dryRun }}
                  forceReleaseWithoutGitPush: ${{ parameters.forceReleaseWithoutGitPush }}

              - script: |
                  yarn beachball publish $(beachballPushArgs) --config scripts/beachball/src/release-web-components.config.js --message 'release: applying package updates - web-components'
                env:
                  GITHUB_PAT: $(githubPAT)
                  NPM_TOKEN: $(npmToken)
                displayName: Publish changes and bump versions
                condition: not(${{ parameters.dryRun }})

              - template: .devops/templates/release-forced-warning.yml@self
                parameters:
                  dryRun: ${{ parameters.dryRun }}

              - script: |
                  git reset --hard origin/master
                displayName: Reset workspace after publish
                condition: not(${{ parameters.dryRun }})

              - template: .devops/templates/cleanup.yml@self
                parameters:
                  checkForModifiedFiles: false
